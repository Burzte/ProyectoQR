<ion-content>

    <div class="container">
      <h5>¡Registrate!</h5>
    </div>

    <ion-item>
      <ion-label position="floating">Usuario</ion-label>
      <ion-input [(ngModel)]="usuario"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Clave</ion-label>
      <ion-input [(ngModel)]="clave" type="password"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Nombre Completo</ion-label>
      <ion-input [(ngModel)]="nombreCompleto"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Teléfono</ion-label>
      <ion-input [(ngModel)]="telefono"></ion-input>
    </ion-item>

    <ion-item>
      <ion-select aria-label="Role" interface="popover" placeholder="Seleccionar Rol">
        <ion-select [(ngModel)]="role"></ion-select>
        <ion-select-option value="docente">Docente</ion-select-option>
        <ion-select-option value="alumno">Alumno</ion-select-option>
      </ion-select>
    </ion-item>

    <div class="button-container">
      <ion-button (click)="registrar()">Registrar</ion-button>
    </div>

    <!-- Mensajes de éxito y de error en texto -->
    <div *ngIf="successMessage" style="color: green;" class="p-3">
      <h6>{{ successMessage }}</h6>
    </div>

    <div *ngIf="errorMessage" style="color: rgb(255, 0, 0);" class="p-3">
      <h6>{{ errorMessage }}</h6>
    </div>

</ion-content>
<app-footer></app-footer>
